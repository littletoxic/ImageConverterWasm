name: Deploy to GitHub Pages
env:
  PUBLISH_DIR: src/ImageConverter/bin/Release/net11.0/publish/wwwroot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish app
        run: dotnet publish src/ImageConverter/ImageConverter.csproj -c Release
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

      - name: Rewrite base href
        shell: bash
        run: perl -0pi -e 's#<base href="/" />#<base href="/ImageConverterWasm/" />#' "$PUBLISH_DIR/index.html"

      - name: Add .nojekyll
        run: touch ${{ env.PUBLISH_DIR }}/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.PUBLISH_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
